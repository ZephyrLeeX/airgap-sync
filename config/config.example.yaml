# Airgap Sync 配置示例。
#
# 数据库密码不要写进本文件:
# 通过 mysql.password_env 指定的环境变量提供真实密码。

role: source

mysql:
  host: 127.0.0.1
  port: 3306
  database: sgaj_data
  user: sgaj_sync
  password_env: AIRGAP_SYNC_MYSQL_PASSWORD
  connect_timeout: 10

paths:
  # 状态库存放在 <data_dir>/state/ 下, Snapshot 输出到 <data_dir>/outbox/ 下。
  # Windows 风格路径同样合法, 例如 D:/airgap-sync/data
  data_dir: D:/airgap-sync/data

snapshot:
  # 每次从 server-side cursor 读取的行数 (流式批量大小, 非协议限制)。
  fetch_size: 2000

chunk:
  # Chunk 同时受行数与未压缩字节数限制, 任一达到阈值即封闭;
  # 单行本身超过字节阈值时允许生成单行超限 Chunk。
  max_rows: 50000
  max_uncompressed_bytes: 67108864 # 64 MiB
  # zstd 压缩级别 (1-19, 默认 3: 速度与压缩比均衡, 不追求极限压缩)。
  compression_level: 3

# source snapshot 不需要 relay；只有 source sync / relay-check 使用本节。
relay:
  base_url: http://10.9.195.133:50552
  # Token 值禁止写入 YAML，只写环境变量名。
  token_env: AIRGAP_SYNC_UPLOAD_TOKEN
  # HTTPS 私有 CA 时配置路径；系统可信 CA 或 HTTP 时省略。
  # ca_file: D:/airgap-sync/certs/internal-ca.pem
  connect_timeout_seconds: 10
  read_timeout_seconds: 600
  max_attempts: 5
  retry_base_seconds: 5
  retry_max_seconds: 60

spool:
  # 运行参数，不是协议常量。积压超过上限或可用空间低于下限时 Run 失败。
  max_pending_bytes: 10737418240 # 10 GiB
  min_free_bytes: 10737418240 # 10 GiB

tables:
  # 所有表统一 FULL_SNAPSHOT: 只需要 name 和 enabled。
  # 不需要配置主键、逻辑键或同步模式。
  - name: std_scjgj_zhgsxt_qyjbxx_all
    enabled: true

  - name: dwd_frk_jbxx_djxx_frjbxx
    enabled: true

  - name: some_legacy_table
    enabled: false
