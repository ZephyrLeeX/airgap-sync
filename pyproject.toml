[project]
name = "airgap-sync"
version = "0.2.1"
description = "单向隔离网络 MySQL 数据同步工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.7",
    "pymysql>=1.1",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tzdata>=2025.2",
    "uvicorn>=0.30,<1",
    "zstandard>=0.25.0",
]

[project.scripts]
airgap-sync = "airgap_sync.cli:main"

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airgap_sync"]

[tool.hatch.build]
artifacts = ["src/airgap_sync/monitor/templates/*.html", "src/airgap_sync/monitor/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs a real MySQL server (deselected by default)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["airgap_sync", "release_manifest", "build_release"]
