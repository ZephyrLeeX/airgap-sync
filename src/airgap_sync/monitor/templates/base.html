<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airgap Sync · {{ self.title() }}</title><link rel="stylesheet" href="/static/monitor.css"></head>
<body><header><div class="brand">Airgap Sync <span>目标端监控</span></div><nav>
<a href="/" {% if page == 'overview' %}class="active"{% endif %}>概览</a>
<a href="/tables" {% if page == 'tables' %}class="active"{% endif %}>数据表</a>
<a href="/runs" {% if page == 'runs' %}class="active"{% endif %}>同步任务</a>
<a href="/system" {% if page == 'system' %}class="active"{% endif %}>系统</a>
<a href="/problems" {% if page == 'problems' %}class="active"{% endif %}>问题</a>
<a href="/alerts" {% if page == 'alerts' %}class="active"{% endif %}>告警</a>
</nav></header><main><div class="heading"><div><h1>{% block title %}{% endblock %}</h1><p>监控观测 · {{ data.timezone }} · 更新时间 {{ data.generated_at|display_time }}</p></div><span class="badge {{ data.status|lower }}">{{ data.status|zh }}</span></div>
{% if data.query_error %}<div class="notice">{{ data.query_error|zh }}。 数据库信息可能不可用。</div>{% endif %}
{% block content %}{% endblock %}</main><footer>监控观测数据和告警历史均为只读。</footer><script src="/static/monitor.js" defer></script></body></html>
